<!DOCTYPE html>
<html>
    <head>
        <title>Webpage</title>
    </head>
    <body>
        <table border="2">
            <thead>
                <th onclick="sort('name',event)" ><!--<span></span>--> Name</th>

                                <td>${r.prepTimeMinutes}</td>
                                <td>${r.rating}</td>
                                 </tr>  `
                     document.getElementById("tb").innerHTML+=ntr

            }
