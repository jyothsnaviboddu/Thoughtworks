            var todo=[]
            function add()
            {
            
                var t=document.getElementById("task").value
                todo.push(t)
                UI()
                document.getElementById("task").value=""
            }
            function UI()
            {
                document.getElementById("list").innerHTML=""
                todo.forEach(function(a,i)
                {
                    var tli=document.createElement("li")
                    tli.innerText=a
                    var btn=document.createElement("button")
                    btn.innerText="Delete"
                    btn.addEventListener('click',function(){deltodo(i)})
                    tli.appendChild(btn)
                    document.getElementById("list").appendChild(tli)

                })
            }
            function deltodo(i)
            {
                todo.splice(i,1)
                UI()
            }
        


        </script>
